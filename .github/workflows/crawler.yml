name: weibo-crawler

# 已禁用自动运行（2026-09-16）
# 原因：GitHub Actions 机房 IP 被微博风控，无法采集
# 当前生产环境：阿里云服务器 + 小米手机代理，每天 08:00 自动采集
# 如需测试可手动触发
on:
  workflow_dispatch:

  jobs:
    crawl:
        runs-on: ubuntu-latest
            steps:
                  - uses: actions/checkout@v4

                        - uses: actions/setup-python@v5
                                with:
                                          python-version: "3.11"

                                                - name: Install dependencies
                                                        run: |
                                                                  pip install pymysql requests snownlp jieba

                                                                        - name: Run post collector
                                                                                run: python step1_comments_spider/weibo_post_collector.py
                                                                                        env:
                                                                                                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                                                                                                            WEIBO_COOKIE: ${{ secrets.WEIBO_COOKIE }}
                                                                                                            
                                                                                                                  - name: Run comment batch collector
                                                                                                                          run: python step1_comments_spider/weibo_comment_batch_collector.py
                                                                                                                                  env:
                                                                                                                                            DATABASE_URL: ${{ secrets.DATABASE_URL }}
                                                                                                                                            
                                                                                                                                                  - name: Generate daily report
                                                                                                                                                          run: python step9_scheduler/scheduler.py --now
                                                                                                                                                                  env:
                                                                                                                                                                            DATABASE_URL: ${{ secrets.DATABASE_URL }}
                                                                                                                                                                            
                                                                                                                                                                                  - name: Upload reports artifact
                                                                                                                                                                                          uses: actions/upload-artifact@v4
                                                                                                                                                                                                  with:
                                                                                                                                                                                                            name: daily-reports
                                                                                                                                                                                                                      path: step9_scheduler/reports/
                                                                                                                                                                                                                                retention-days: 30
                                                                                                                                                                                                                                
